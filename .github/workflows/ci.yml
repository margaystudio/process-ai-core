# Calidad en cada push: tests contra un Postgres efímero.
#
# Los tests de este módulo no mockean la base (19 de 53 archivos usan la sesión
# real de la app). Apuntados al Supabase compartido tardaban 20:50 y saturaban el
# pooler, rompiendo los tests de los otros módulos. Contra el Postgres de servicio
# la suite baja a menos de un minuto, que es lo que hace viable tener CI.
#
# Ver `knowledge/12-testing.md` del repo margay-dev-agent y docker-compose.yml.

name: ci
run-name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector sobre la misma major que Supabase (17). La migración 0005 crea
        # `vector(1536)` + índices hnsw; sin la extensión degrada a TEXT y el hot
        # path SQL de la capa semántica queda sin probar.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: process_ai
          POSTGRES_PASSWORD: process_ai
          POSTGRES_DB: process_ai
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U process_ai -d process_ai"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env:
      TEST_DATABASE_URL: postgresql+psycopg://process_ai:process_ai@127.0.0.1:55433/process_ai
      DATABASE_SCHEMA: process_ai
      ENVIRONMENT: local
      # Valores de relleno: no hay `.env` en CI y nada debe salir a la red.
      # Los tests que tocan OpenAI o Supabase mockean el cliente.
      OPENAI_API_KEY: sk-test-no-se-usa
      SUPABASE_URL: http://localhost:9
      SUPABASE_SERVICE_ROLE_KEY: service-role-de-mentira
      WORKSPACE_URL: http://localhost:9   # inalcanzable a propósito
      STORAGE_BACKEND: local

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias del sistema (WeasyPrint)
        # WeasyPrint necesita Pango/Cairo/GDK-PixBuf nativos para rendir los PDFs;
        # sin esto, todos los tests de export/freeze fallan al importar.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b \
            libcairo2 libgdk-pixbuf-2.0-0 libffi-dev

      - name: Instalar dependencias
        # Desde el LOCK, no resolviendo los rangos de pyproject.toml. CI tiene que
        # correr contra las mismas versiones que la imagen (Dockerfile.api instala
        # el mismo requirements.lock) y que el desarrollo local. Sin esto, cada
        # corrida resolvía lo más nuevo publicado ese día: así fue como CI saltó
        # solo a Starlette 1.x, un major, y falló un test que en local pasaba.
        #
        # `--no-deps` en el editable: las dependencias ya están todas ancladas
        # arriba; sin el flag, pip volvería a resolver los rangos y podría pisarlas.
        run: |
          pip install -r requirements-dev.lock
          pip install -e . --no-deps

      - name: El lock está al día con pyproject
        # Un lock que se desactualiza en silencio es peor que no tenerlo: da la
        # sensación de reproducibilidad sin darla. Recompilar es determinístico
        # (uv preserva los pines que siguen satisfaciendo las restricciones), así
        # que esto solo falla si alguien tocó las dependencias sin regenerarlo —
        # nunca por el paso del tiempo.
        run: |
          pip install uv
          cp requirements.lock /tmp/antes.lock
          cp requirements-dev.lock /tmp/antes-dev.lock
          uv pip compile pyproject.toml --universal --python-version 3.12 \
            --generate-hashes -o requirements.lock -q
          uv pip compile pyproject.toml --extra dev --universal --python-version 3.12 \
            --generate-hashes -o requirements-dev.lock -q
          if ! diff -u /tmp/antes.lock requirements.lock \
             || ! diff -u /tmp/antes-dev.lock requirements-dev.lock; then
            echo "::error::pyproject.toml cambió y los lock quedaron viejos. Regeneralos:"
            echo "  uv pip compile pyproject.toml --universal --python-version 3.12 --generate-hashes -o requirements.lock"
            echo "  uv pip compile pyproject.toml --extra dev --universal --python-version 3.12 --generate-hashes -o requirements-dev.lock"
            exit 1
          fi

      - name: Aplicar migraciones
        run: alembic upgrade head
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          # Evita que process_ai_core.db.database cargue un .env inexistente y
          # deje DATABASE_URL vacía.
          PROCESS_AI_BOOTSTRAP: "1"

      - name: Sembrar roles y permisos
        # Las migraciones crean el esquema pero no los roles de sistema. Sin esto
        # se caen 17 tests con "Rol 'admin' (ni 'viewer') encontrado en la DB".
        # Idempotente.
        run: python tools/seed_permissions.py
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          PROCESS_AI_BOOTSTRAP: "1"

      - name: Tests
        run: python -m pytest -q
