[project]
name = "process-ai-core"
version = "0.1.0"
description = "Core de IA para generar documentación de procesos a partir de audio, video, imágenes y texto."
authors = [
    { name = "Santiago" }
]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.35.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0",
    "fastapi>=0.104.0",
    "pydantic>=2.0.0",
    "pydantic[email]>=2.0.0",
    "python-multipart>=0.0.6",
    "uvicorn[standard]>=0.24.0",
    "supabase>=2.0.0",
    "pyjwt>=2.8.0",
    "cryptography>=41.0.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "email-validator>=2.0.0",
    "markdown>=3.5.0",
    # WeasyPrint NO es una dependencia cualquiera: es el único motor de salida y
    # su versión es parte del contrato del artefacto de auditoría. El PDF de una
    # versión aprobada tiene su SHA-256 registrado en document_versions; si un
    # rebuild trae otro major, el layout cambia y un re-freeze produciría un PDF
    # distinto del que tiene el hash guardado.
    #
    # Antes decía `>=60.0` sin techo, y el contenedor corría 69.0 mientras local
    # tenía 68.1 — dos motores distintos para el mismo artefacto. El techo va en
    # el major siguiente, no dos majores más adelante: un rango como `>=68.1,<70`
    # permitiría exactamente la divergencia que esto viene a cerrar.
    #
    # Para subir de major: verificar reproducibilidad (tests/test_pdf_reproducibility.py)
    # y comparar visualmente un PDF antes/después, porque cambia la paginación.
    "weasyprint>=69.0,<70",
    # QR de verificación de la portada del PDF. `[pil]` porque se genera como
    # PNG para embeberlo como data URI (ver process_ai_core/export/qr.py).
    "qrcode[pil]>=7.4,<9",
    "pypdf>=4.0.0",
    "python-docx>=1.0.0",
    "pytesseract>=0.3.10",
    "pymupdf>=1.24.0",
    "Pillow>=10.0.0",
    "langdetect>=1.0.9",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=67.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["process_ai_core"]

[tool.pytest.ini_options]
markers = [
    "lote(n): cantidad de documentos que arma la fixture `lote` (default 6)",
]
testpaths = ["tests"]
pythonpath = [
    ".",
    "process_ai_core",
]
filterwarnings = [
    # Suprimir warnings de SQLAlchemy sobre datetime.utcnow() deprecado
    # Estos warnings vienen de la librería externa y se resolverán cuando SQLAlchemy actualice su código
    "ignore::DeprecationWarning:sqlalchemy.*",
]